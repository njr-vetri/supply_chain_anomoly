repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
      - id: protected-files
        name: Block raw data and model artifacts
        entry: python scripts/check_protected_files.py
        language: system
        pass_filenames: false
      - id: local-secrets-scan
        name: Heuristic secrets scan
        entry: python scripts/security_scan.py
        language: system
        pass_filenames: false
