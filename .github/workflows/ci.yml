name: Local project CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Ruff lint
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest -q --basetemp=.pytest_tmp
